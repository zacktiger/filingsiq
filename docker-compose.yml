# FilingsIQ infrastructure - Phase 1
#
# Only Qdrant for now. Postgres (financial tables, chat history) and Redis
# (cache, job queue) arrive in Phase 5 and Phase 7 respectively.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: filingsiq-qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC, used by qdrant-client when prefer_grpc=True
    volumes:
      # Named volume, so the index survives `docker compose down` and restarts.
      # This is the main reason we chose Qdrant over an in-memory store: a
      # bge-m3 re-index is slow enough that losing it on every restart hurts.
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
